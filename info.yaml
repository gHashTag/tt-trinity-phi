# Tiny Tapeout project information - Trinity Phi, GF16 DOT4 (SKY26d)
# https://tinytapeout.com/specs/info_yaml/
#
# Contract: specs/numeric/gf16_dot4_sky26d.t27 (issue #100). Whether this design fits one
# 1x1 tile and meets 50 MHz is UNKNOWN until the GDS run of the final commit says so.
yaml_version: 6

project:
  title:        "Trinity Phi - GF16 DOT4 (pin-loadable)"
  author:       "Dmitrii Vasilev (original project); Dmitrii Fedorov (DOT4 rewrite)"
  discord:      "ghashtag"
  description:  >
    Pin-loadable dot product of two 4-element vectors in the 16-bit GF16 float format
    (1 sign, 6 exponent, 9 mantissa, bias 31). The host loads A[0..3] and B[0..3] as 16 bytes
    through ui_in, starts the computation, and reads the 16-bit result a byte at a time
    from uo_out. One shared multiplier and one shared adder, 8 clocks per dot product.
    Multiply rounds to nearest with ties toward zero; add is exact round-to-nearest-even.
    uio is input only.
  language:     "Verilog"
  clock_hz:     50000000

  # One tile. Fit in 1x1 is proven only by the GDS run of the final commit.
  tiles:        "1x1"

  top_module:   "tt_um_trinity_nano"

  # Exactly the files the top instantiates; checked against test/Makefile PROJECT_SOURCES
  # by test/check_project.py.
  source_files:
    - "tt_um_trinity_nano.v"
    - "gf16_v2_mul.v"
    - "gf16_v2_add.v"
    - "gf16_sig_mul10.v"

pinout:
  ui[0]: "data[0] - byte to write (WR); in read select 5 it is address bit 0 of cell[ui[3:0]]"
  ui[1]: "data[1] - address bit 1 in read select 5"
  ui[2]: "data[2] - address bit 2 in read select 5"
  ui[3]: "data[3] - address bit 3 in read select 5"
  ui[4]: "data[4] - ignored in read select 5"
  ui[5]: "data[5] - ignored in read select 5"
  ui[6]: "data[6] - ignored in read select 5"
  ui[7]: "data[7] - ignored in read select 5"
  uo[0]: "read[0] - byte chosen by RSEL (status, result low/high, signature, cell readback)"
  uo[1]: "read[1]"
  uo[2]: "read[2]"
  uo[3]: "read[3]"
  uo[4]: "read[4]"
  uo[5]: "read[5]"
  uo[6]: "read[6]"
  uo[7]: "read[7]"
  uio[0]: "WR - input, rising edge writes ui[7:0] into cell[PTR] and advances PTR"
  uio[1]: "GO - input, rising edge starts the dot product (resets PTR to 0)"
  uio[2]: "RSEL[0] - input, read select bit 0"
  uio[3]: "RSEL[1] - input, read select bit 1"
  uio[4]: "RSEL[2] - input, read select bit 2"
  uio[5]: "reserved - input, ignored (drive 0)"
  uio[6]: "reserved - input, ignored (drive 0)"
  uio[7]: "reserved - input, ignored (drive 0)"
