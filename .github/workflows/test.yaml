name: RTL & Cocotb Tests

# SKY26d GF16 DOT4 (issue #100). Every job below fails closed: there is no `|| true`, no
# `continue-on-error`, and a green `make` alone is not accepted (test/check_results.py).
# The gate-level run of the SAME pin tests is done by the official gl_test job in gds.yaml.

on:
  push:                 # every branch: a feature-branch or fork push runs ALL jobs below
  pull_request:
  workflow_dispatch:

jobs:
  spec-static:
    name: Spec assertions, oracle self-check, source-list gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute every test and invariant block of the .t27 spec (fail-closed adapter)
        run: python3 test/t27_exec.py

      - name: Oracle self-check, conformance vectors, spec vs oracle vs pin model
        run: python3 test/oracle_selfcheck.py

      - name: Source list == Makefile == instantiated files, pins, official action pin, no '*'
        run: python3 test/check_project.py

      # Fixtures only (no LibreLane, Docker, PDK, t27c or Zig): the official block profiler with its add_norm14
      # probe, and the native adapter of specs/physical/gf16_dot4_addnorm_probe.t27 on fake tool outputs.
      - name: Block-profile fixtures (five probes incl. add_norm14, fail-closed, calibration, provenance)
        run: python3 test/test_official_block_profile.py

      - name: Fixtures of the native adapter for the add_norm14 measurement sidecar
        run: python3 test/test_t27_addnorm_native_gate.py

  unit-full:
    name: Isolated MUL/ADD vs exact oracle (full sweeps, 0 mismatches)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      # Zero operands of the adder (policy: specs/physical/gf16_dot4_addnorm_probe.t27 section 5): +0 and -0
      # against all 65536 codes in both orders (262144 vectors, oracle expected), and a negative control in a
      # temporary copy that must be KILLED. Runs before, and does not replace, the full sweeps below.
      - name: Targeted zero-operand ADD sweep with negative control
        run: python3 test/add_zero_sweep.py --out add-zero-sweep

      # ADD significand ripple chain (policy: section 6 of the same sidecar): deterministic carry set (cancellation,
      # borrow, carry, ties, far jam, edges, specials, conformance ADD steps) against the oracle, plus a
      # temporary wrong-carry-seed copy that must be KILLED. In addition to, not instead of, every other check.
      - name: ADD carry-chain check with negative control
        run: python3 test/add_carry_check.py --out add-carry-check

      - name: Full unit sweeps (also all 2^20 shift-and-add products vs integer product)
        run: python3 test/unit_sweeps.py --profile full --jobs 4

      - name: Upload the zero-operand sweep summary and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-zero-sweep
          path: |
            add-zero-sweep/
            add-carry-check/
          if-no-files-found: error

  pin-rtl:
    name: Pin-level cocotb tests (RTL)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cocotb (pinned) and IVerilog
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv iverilog
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r test/requirements.txt

      - name: Run the pin tests
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          cd test
          PHI_RANDOM_N=2000 make

      - name: Require every declared test to have run and passed
        run: python3 test/check_results.py test/results.xml test/test.py

  mutations:
    name: Negative controls (mutated RTL must fail the pin tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cocotb (pinned) and IVerilog
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv iverilog
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r test/requirements.txt

      - name: Run the mutation harness
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          python3 test/mutation_runner.py

  synth-audit:
    name: Yosys audit of the active sources (no $mul)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys python3

      - name: Fail-closed Yosys audit
        run: python3 test/synth_audit.py

  t27-native:
    name: "Native t27c gate (pinned t27, verified Zig 0.16.0): parse, typecheck, test-report, seal"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout this project (the spec lives in its own specs/ tree)
        uses: actions/checkout@v4

      # The t27 toolchain goes into a SEPARATE folder; it never replaces this project's workspace.
      - name: Checkout the pinned t27 toolchain source
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: 32c25e8798e33e03d5f6e7aee876df8629008a49
          path: t27-src

      - name: Build t27c from the pinned commit (locked)
        run: |
          set -euo pipefail
          cd t27-src
          cargo build --release -p t27c --locked
          test -x target/release/t27c

      - name: Fetch Zig 0.16.0 from the official vendor and verify it (index size and sha256)
        run: python3 test/fetch_zig.py --version 0.16.0 --dest "$RUNNER_TEMP/zig" --path-file "$GITHUB_PATH"

      - name: Native parse, typecheck, test-report, seal --save and --verify (no --force)
        run: |
          set -euo pipefail
          test -z "${T27C_TEST_REPORT_EXIT_ZERO:-}"
          python3 test/t27_native_gate.py \
            --t27c "$GITHUB_WORKSPACE/t27-src/target/release/t27c" \
            --spec specs/numeric/gf16_dot4_sky26d.t27 \
            --out native-t27 \
            --t27-src "$GITHUB_WORKSPACE/t27-src" \
            --t27-commit 32c25e8798e33e03d5f6e7aee876df8629008a49

      # Runs only after the numeric gate above passed (same pinned t27c, Zig and witness arguments). One fixed
      # profile: the measurement sidecar, exactly 2 tests, its own two negative controls, own output folder.
      - name: Native gate of the add_norm14 measurement sidecar (parse, typecheck, test-report 2/2, seal, 2 negative controls)
        run: |
          set -euo pipefail
          test -z "${T27C_TEST_REPORT_EXIT_ZERO:-}"
          python3 test/t27_addnorm_native_gate.py \
            --t27c "$GITHUB_WORKSPACE/t27-src/target/release/t27c" \
            --spec specs/physical/gf16_dot4_addnorm_probe.t27 \
            --out native-addnorm \
            --t27-src "$GITHUB_WORKSPACE/t27-src" \
            --t27-commit 32c25e8798e33e03d5f6e7aee876df8629008a49

      - name: Upload the native outputs and the seal for review (not auto-committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t27-native-gate
          path: native-t27/
          if-no-files-found: error

      - name: Upload the native outputs of the add_norm14 sidecar (not auto-committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t27-native-addnorm
          path: native-addnorm/
          if-no-files-found: error

  # ---- compatibility jobs kept from the archived baseline (they test archived files) ----
  gf16-fix-verify:
    name: GF16 v2 arithmetic fix verification (archived comparison, faithful check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: Compare old units and the SKY26d v2 units on the staged pair set
        run: python3 test/gf16_v2_verify.py

  width-defect-gate:
    name: Width/range defect gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator python3

      - name: No new 'field one bit too narrow' defects (value-overflow / out-of-range select)
        run: python3 test/width_gate.py

  gfn-add-sweep:
    name: GoldenFloat gfN adder functional sweep
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: gf8..gf256 adders vs exact-rational reference (<= 1 ULP)
        run: python3 test/gf_add_sweep.py

  instantiated-audit:
    name: Archived Phi blocks conformance audit (not part of the active design)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install IVerilog
        run: sudo apt-get update && sudo apt-get install -y iverilog python3

      - name: Archived blocks (phi_anchor_post, sacred_constants_rom, phi_mesh_bridge, phi_d2d_lite)
        run: python3 test/phi_audit.py
