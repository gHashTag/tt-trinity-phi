name: t27 Format Validation

on:
  push:                 # every branch, so a feature-branch or fork push runs these checks too
  pull_request:
  workflow_dispatch:

jobs:
  rtl-r-si-1-check:
    name: R-SI-1 Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install iverilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog

      - name: Check R-SI-1 (zero standalone * operators)
        run: |
          echo "=== R-SI-1: checking for forbidden arithmetic * operators ==="
          # Grandfathered ARCHIVAL files, unchanged since baseline 81f02d5 and NOT in the active
          # design: gf16_mul.v (legacy GF16 Karatsuba mantissa product) and gf128_mul.v (legacy,
          # line 43 holds a '*' full product). The 4 active files are not exempt: test/check_project.py
          # and test/synth_audit.py (CI job spec-static / synth-audit) forbid any '*' there.
          # tb_*.v are simulation-only testbenches, not synthesisable RTL
          FAIL=0
          for f in src/*.v; do
            base=$(basename "$f")
            case "$base" in
              gf16_mul.v|gf128_mul.v|tb_*.v) continue ;;
            esac
            # Strip line and block comments before scanning, then exclude:
            #   - `always @*` / `always @ ( * )` wildcard sensitivity
            #   - attribute pragmas `(* keep *)`, `(* no_retiming *)`, etc.
            #   - bit-select / slice indices: `[N*PARAM`, `*W-1`, `*W]`, `*W +:`
            #   - flat-bus array bounds `4*`TRN_PKT_W`
            HITS=$(sed 's://.*::; s:/\*[^*]*\*/::g' "$f" \
              | grep -n '\*' \
              | grep -vE '@\s*\(?\s*\*\s*\)?' \
              | grep -vE '\(\*[[:space:]A-Za-z_=" ,0-9-]+\*\)' \
              | grep -vE '\[[0-9]+\*[A-Za-z_`]' \
              | grep -vE '\[\([^]]*\)\*[A-Za-z_`]' \
              | grep -vE '\*[A-Za-z_`][A-Za-z_0-9]*[-+]?[0-9]*[:\] ]' \
              | grep -vE '\*[A-Za-z_`][A-Za-z_0-9]*\s*\+:' \
              | grep -vE 'gi\s*\*\s*[0-9]+\s*\+' \
              | grep -vE '\*\s*[0-9]+\s*\+:' \
              | grep -vE '\*\s*`[A-Z_]+' \
              | grep -vE '\[.*[a-z_][a-z0-9_]*\s*\*\s*[0-9]' \
              | grep -vE '\{[0-9]+\*[A-Za-z_`]' \
              | grep '[^*]\*[^*/]' || true)
            if [ -n "$HITS" ]; then
              echo "FAIL $f:"
              echo "$HITS"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 0 ]; then
            echo "PASS: R-SI-1 clean — zero arithmetic * operators"
          else
            exit 1
          fi

      - name: iverilog compile check (Verilog-2005), compiler failure fails the job
        run: |
          set -euo pipefail
          echo "=== iverilog -g2005 compile check of the active design ==="
          # No pipe, no `|| true`: a compile error, an unknown module or a syntax error is a
          # non-zero exit and fails this step. -y src resolves the instantiated sub-modules.
          iverilog -g2005 -Wall -y src \
            src/tt_um_trinity_nano.v \
            -o "$RUNNER_TEMP/phi-top.vvp"
          test -s "$RUNNER_TEMP/phi-top.vvp"
          echo "compiled: iverilog exited 0 and produced the vvp file"

      - name: Verify top module name
        run: |
          echo "=== Checking top_module = tt_um_trinity_nano ==="
          grep -q 'module tt_um_trinity_nano' src/tt_um_trinity_nano.v && echo "PASS" || (echo "FAIL: top module not found" && exit 1)

      - name: Verify info.yaml tiles
        run: |
          echo "=== Checking tiles = 1x1 ==="
          grep -q 'tiles.*1x1' info.yaml && echo "PASS: tiles=1x1" || (echo "FAIL: wrong tiles" && exit 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
