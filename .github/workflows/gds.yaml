---
name: gds

# Official Tiny Tapeout SKY26d actions. The annotated tag TinyTapeout/tt-gds-action@ttsky26d
# dereferences to the commit pinned below; test/check_project.py fails if any TinyTapeout
# action in this file or in docs.yaml is not pinned to it, or still names an older shuttle.
# The gl_test job runs the SAME pin tests as the RTL job: with test/requirements.txt present
# the action installs cocotb==2.0.1 from it, then `make -B GATES=yes`.

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d
        with:
          pdk: sky130A

      # Diagnosis only, NOT a fit proof and NOT part of the physical verdict. It runs even when Build
      # GDS fails (the PDK stays on this runner); a red Build GDS stays red whatever this step does.
      # It uses the host yosys (a different version from the GDS flow, recorded in the artifact) and
      # the real sky130 hd liberty found on the runner. Any incomplete diagnosis (missing liberty,
      # failed profile, a cell of unknown area) makes THIS step exit non-zero and report FAIL with no
      # area numbers, never 0. If Build GDS itself passed and only the diagnosis failed, this job is
      # red on purpose (fail closed). See test/area_profile.py.
      - name: Area profile postmortem (hierarchical diagnosis)
        if: always()
        run: python3 test/area_profile.py --out area-profile --pdk sky130A

      - name: Upload the area profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AREA_PROFILE
          path: area-profile/
          if-no-files-found: error

      # Measurement only, NOT a fit proof. Runs the official LibreLane 3.0.14 built-in SynthesisExploration
      # flow (AREA 0..3, DELAY 0..4: Yosys.Synthesis, CheckSDC, STAPrePNR) on the SAME src/config_merged.json,
      # PDK and cell exclusions, in its own run directory (runs/wokwi is untouched). The built-in flow can exit
      # 0 with a failed strategy hidden inside, so test/synth_explore.py rebuilds the nine rows from the real
      # step states and fails (non-zero) on any incomplete table, failed strategy, or when the row of the
      # strategy used by the official Build GDS does not reproduce that run's own area and cell count (the
      # baseline is read from runs/wokwi, nothing is hard-coded). A red Build GDS stays red whatever this
      # step does.
      - name: Official synthesis strategies (measurement)
        if: always()
        timeout-minutes: 30
        run: python3 test/synth_explore.py --out synth-explore-out

      - name: Upload the synthesis strategies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYNTH_EXPLORE
          path: |
            synth-explore-out/
            runs/synth-explore/
          if-no-files-found: error

      # Area-only measurement, NOT timing and NOT a fit proof. Six (default) sequential synthesis-only runs of the
      # official LibreLane 3.0.14 (Classic flow stopped after Yosys.Synthesis) on the same config, sources, PDK and
      # exclusions; only SYNTH_STRATEGY (AREA 0/1/2) and SYNTH_ABC_AREA_USE_NF change here (MFS3 stays False). The
      # optional 12-row matrix (--include-mfs3) is NOT run in CI: its six MFS3=True rows aborted in the upstream ABC
      # (Abc_TtExpand assertion, rc 134) at the 22c run, a recorded FAIL; the script can reproduce it on demand. The row
      # that matches the current official run must reproduce it; every row is checked against the official
      # provenance. A tool error, an unsupported option, an incomplete table or a mismatch fails this step; a red
      # Build GDS stays red whatever this step does. It runs before the long simulation so the numbers arrive early.
      - name: Official ABC area knobs (measurement)
        if: always()
        timeout-minutes: 60
        run: python3 test/synth_area_tune.py --out area-tune-out

      - name: Upload the ABC area knobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AREA_TUNE
          path: |
            area-tune-out/
            runs/area-tune/
          if-no-files-found: error

      # Technology-branch check of the multiplier, NOT a layout/LVS proof and NOT a fit proof. The
      # official synthesis maps the 3-term carry-save positions to sky130_fd_sc_hd__fa_1 (selected by
      # the flow's __pnr__ define); this step simulates that branch with the real PDK Verilog models of the
      # pinned PDK on this runner: the 8 truth cases of the cell and wrapper, all 2^20 products against
      # the integer product, and a negative control that must be caught; and the active adder (its significand
      # sum uses the same wrapper) on the zero set (262144) and the carry set against the oracle, with its own
      # wrong-carry-seed control that must be caught. No fallback model; a missing or
      # ambiguous PDK, an unknown or non-zero result fails the step. It runs even when the placement
      # failed; a red Build GDS stays red whatever this step does.
      - name: Physical full-adder model check
        if: always()
        timeout-minutes: 60
        run: python3 test/physical_fa_check.py --out physical-fa-check

      - name: Upload the physical full-adder check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHYSICAL_FA_CHECK
          path: physical-fa-check/
          if-no-files-found: error

      # Measurement only, NOT a fit proof. Five synthesis-only runs of the official LibreLane 3.0.14 (same
      # image, PDK and cell exclusions; Classic flow stopped after Yosys.Synthesis, so no SDC/STA): the full
      # design (calibration against runs/wokwi of this SHA, read only), gf16_v2_mul, gf16_v2_add, add_norm14
      # (the existing gf16_add_norm14 module of gf16_v2_add.v synthesised alone, never subtracted from add), and the
      # storage/control top with temporary black boxes for those two (their area is reported as excluded, never
      # as zero). Probe areas are not additive. test/official_block_profile.py fails (non-zero) on a missing or
      # unknown area, a calibration mismatch or a tool error; a red Build GDS stays red whatever this step does.
      - name: Official block area profile (measurement)
        if: always()
        timeout-minutes: 60
        run: python3 test/official_block_profile.py --out block-profile-out

      - name: Upload the block area profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK_PROFILE
          path: |
            block-profile-out/
            runs/block-profile/
          if-no-files-found: error

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d

  # The viewer only PUBLISHES the 3D view to GitHub Pages. It is optional and is NOT a physical
  # check: gds, precheck and gl_test above stay required on every push, on the same SHA. The
  # viewer job runs only on the default branch (main) of whichever repository runs the workflow
  # and is SKIPPED on every other branch (not failed, not masked). On the default branch of a
  # FORK it does run there; whether GitHub Pages is set up in that fork is not verified. A
  # skipped viewer proves nothing about the layout; only gds + precheck + gl_test do.
  viewer:
    needs: gds
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d
